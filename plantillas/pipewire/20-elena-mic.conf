# ELENA — mic virtual, supresión de ruido y puente entre llamadas
#
# PLANTILLA: `elena equipo generar` la copia a local/ con el mic de local/equipo.toml
# (ELENA_MIC_FISICO). Sin mic, no se genera.
#
#   mic físico ────────┬─[elena_directo]──────────────────────────┐
#                      └─► echo-cancel (elena_limpio) ─[elena_limpio_a_voz]┴─► elena_voz (tira del mic)
#                                                                              │
#     elena_sistema.monitor ─[elena_puente_navegador]─┐  [elena_voz_a_mic]     ├─► elena_mic      (Discord; por defecto)
#     elena_chat.monitor ────[elena_puente_chat]──────┼──[elena_voz_a_mic_web]─┴─► elena_mic_web  (Meet)
#
# Interruptores (mise run mic:ruido / mic:puente). Silencian streams; WirePlumber lo recuerda:
#   ruido on  → elena_directo silenciado, elena_limpio_a_voz activo
#   ruido off → al revés
#   puente on → elena_puente_navegador y elena_puente_chat activos (por defecto, silenciados)
#
# Ganancia y silencio de TU voz en todos los mics: el volumen de "ELENA · Voz" en pavucontrol.
#
# Las mezclas internas (elena_voz, elena_mic.mezcla, elena_mic_web.mezcla) son sinks:
# aparecen en las listas de salida, pero no son para apps. priority.session baja evita
# que WirePlumber los elija como sink por defecto.

context.objects = [
  # La tira del mic: sink nulo cuya salida (monitor) alimenta a los dos mics.
  # monitor.channel-volumes hace que su volumen y silencio afecten al monitor.
  { factory = adapter
    args = {
      factory.name            = support.null-audio-sink
      node.name               = "elena_voz"
      node.description        = "ELENA · Voz (interno)"
      media.class             = "Audio/Sink"
      audio.position          = [ MONO ]
      monitor.channel-volumes = true
      priority.session        = 1
      object.linger           = true
    }
  }
]

context.modules = [

  # Supresión de ruido y cancelación de eco (WebRTC). Referencia del eco: el monitor
  # del sink por defecto (monitor.mode), que es elena_sistema, donde suena Meet.
  { name = libpipewire-module-echo-cancel
    args = {
      library.name   = aec/libspa-aec-webrtc
      monitor.mode   = true
      audio.position = [ MONO ]
      aec.args = {
        webrtc.noise_suppression = true
        webrtc.high_pass_filter  = true
        webrtc.gain_control      = false
        webrtc.voice_detection   = false
      }
      capture.props = {
        node.name          = "elena_limpio.captura"
        target.object      = "@MIC@"
        node.dont-fallback = true
        node.linger        = true
      }
      source.props = {
        node.name        = "elena_limpio"
        node.description = "ELENA · Mic limpio (interno)"
      }
      sink.props = {
        node.name    = "elena_limpio.referencia"
        node.passive = true
      }
      playback.props = {
        node.name = "elena_limpio.salida"
      }
    }
  }

  # Mic sin procesar → elena_voz
  { name = libpipewire-module-loopback
    args = {
      node.description = "ELENA · Mic directo"
      audio.position   = [ MONO ]
      capture.props = {
        node.name          = "elena_directo.entrada"
        target.object      = "@MIC@"
        node.dont-fallback = true
        node.linger        = true
      }
      playback.props = {
        node.name          = "elena_directo"
        target.object      = "elena_voz"
        node.dont-fallback = true
        node.linger        = true
      }
    }
  }

  # Mic limpio (echo-cancel) → elena_voz
  { name = libpipewire-module-loopback
    args = {
      node.description = "ELENA · Mic limpio"
      audio.position   = [ MONO ]
      capture.props = {
        node.name          = "elena_limpio_a_voz.entrada"
        target.object      = "elena_limpio"
        node.dont-fallback = true
        node.linger        = true
      }
      playback.props = {
        node.name          = "elena_limpio_a_voz"
        target.object      = "elena_voz"
        node.dont-fallback = true
        node.linger        = true
      }
    }
  }

  # Mic virtual para Discord y todo lo demás (fuente por defecto)
  { name = libpipewire-module-loopback
    args = {
      node.description = "ELENA · Mic"
      audio.position   = [ MONO ]
      capture.props = {
        node.name        = "elena_mic.mezcla"
        node.description = "ELENA · Mic (mezcla interna)"
        media.class      = "Audio/Sink"
        priority.session = 1
      }
      playback.props = {
        node.name   = "elena_mic"
        media.class = "Audio/Source"
      }
    }
  }

  # Mic virtual para Meet (se elige en el navegador)
  { name = libpipewire-module-loopback
    args = {
      node.description = "ELENA · Mic web"
      audio.position   = [ MONO ]
      capture.props = {
        node.name        = "elena_mic_web.mezcla"
        node.description = "ELENA · Mic web (mezcla interna)"
        media.class      = "Audio/Sink"
        priority.session = 1
      }
      playback.props = {
        node.name   = "elena_mic_web"
        media.class = "Audio/Source"
      }
    }
  }

  # Tu voz → los dos mics
  { name = libpipewire-module-loopback
    args = {
      node.description = "ELENA · Voz → Mic"
      audio.position   = [ MONO ]
      capture.props = {
        node.name           = "elena_voz_a_mic.entrada"
        stream.capture.sink = true
        target.object       = "elena_voz"
        node.dont-fallback  = true
        node.linger         = true
      }
      playback.props = {
        node.name          = "elena_voz_a_mic"
        target.object      = "elena_mic.mezcla"
        node.dont-fallback = true
        node.linger        = true
      }
    }
  }
  { name = libpipewire-module-loopback
    args = {
      node.description = "ELENA · Voz → Mic web"
      audio.position   = [ MONO ]
      capture.props = {
        node.name           = "elena_voz_a_mic_web.entrada"
        stream.capture.sink = true
        target.object       = "elena_voz"
        node.dont-fallback  = true
        node.linger         = true
      }
      playback.props = {
        node.name          = "elena_voz_a_mic_web"
        target.object      = "elena_mic_web.mezcla"
        node.dont-fallback = true
        node.linger        = true
      }
    }
  }

  # Puente: lo que suena en el navegador (Meet, persona B) → mic de Discord.
  # La captura es pasiva: escuchar el monitor no mantiene despiertas las bocinas.
  { name = libpipewire-module-loopback
    args = {
      node.description = "ELENA · Puente navegador → Mic"
      audio.position   = [ FL FR ]
      capture.props = {
        node.name           = "elena_puente_navegador.entrada"
        stream.capture.sink = true
        target.object       = "elena_sistema"
        node.passive        = true
        node.dont-fallback  = true
        node.linger         = true
      }
      playback.props = {
        node.name          = "elena_puente_navegador"
        target.object      = "elena_mic.mezcla"
        node.dont-fallback = true
        node.linger        = true
      }
    }
  }

  # Puente: lo que suena en el chat (Discord, persona A) → mic de Meet.
  { name = libpipewire-module-loopback
    args = {
      node.description = "ELENA · Puente chat → Mic web"
      audio.position   = [ FL FR ]
      capture.props = {
        node.name           = "elena_puente_chat.entrada"
        stream.capture.sink = true
        target.object       = "elena_chat"
        node.passive        = true
        node.dont-fallback  = true
        node.linger         = true
      }
      playback.props = {
        node.name          = "elena_puente_chat"
        target.object      = "elena_mic_web.mezcla"
        node.dont-fallback = true
        node.linger        = true
      }
    }
  }
]
