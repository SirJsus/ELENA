# ELENA — «Solo audífonos»: Música, Juegos y Sistema a los audífonos (los de Chat).
#
# PLANTILLA: `elena equipo generar` la copia a local/ con los audífonos de local/equipo.toml
# (ELENA_AUDIFONOS). Sin audífonos, no se genera.
#
# elena_audifonos es un sink 5.1 que convierte a estéreo y sale a donde va Chat. No recibe nada hasta
# que el modo se prende (`elena audifonos on`, tecla h de la consola): entonces las salidas de los
# buses de bocinas (<bus>.salida) se mueven aquí, y el vigilante las mantiene así hasta apagarlo.
# Guía: docs/guias/consola.md#solo-audífonos
#
# Dos caminos, y solo uno suena (los cambia `elena audifonos binaural|directo`, en vivo; por omisión,
# directo):
# - binaural: cada canal pasa por la HRTF MIT KEMAR (libmysofa) en su ángulo de bocina (FL 30°,
#   FR 330°, FC 0°, RL 110°, RR 250°), como bocinas virtuales delante y detrás de ti. El LFE va
#   igual a los dos oídos.
# - directo: la mezcla estéreo de siempre (FC y traseras a −3 dB).
# En los dos, el LFE va +10 dB sobre las frontales (como un receptor, y como [lfe] nivel de la
# calibración) y al final un estante de graves: +6 dB en 105 Hz (la forma de la curva Harman para
# audífonos). Aquí no hay calibración de bocinas: ni el nivel, ni el balance, ni el cruce.
# Muchos audífonos «7.1» no hacen surround por su cuenta: en Linux son una tarjeta USB estéreo y el
# surround virtual es software de Windows. Este bus lo hace aquí.
#
# Controles en vivo (pw-cli set-param <id de elena_audifonos> Props '{ params = [ "<control>" <valor> ] }'):
#   salida_l:Gain 1 / salida_r:Gain 1   binaural (0 = apagado; 0.3 = encendido, con el nivel)
#   salida_l:Gain 2 / salida_r:Gain 2   directo  (0 = apagado; 0.5 = encendido, con el nivel)
#   bin_l:Gain 6 / bin_r:Gain 6 / dir_l:Gain 4 / dir_r:Gain 4   el LFE en cada camino (3.162 = +10 dB)
#   graves_l:Gain / graves_r:Gain (dB) y :Freq (Hz)               el estante de graves
# Los pone `elena audifonos graves <dB> [--hz F]` y `elena audifonos lfe <dB>` (los valores de aquí
# son los de por omisión de src/elena/audifonos.py; el vigilante pone los guardados).
#
# node.dont-fallback y node.linger en la salida, como los buses: si los audífonos están apagados,
# espera en silencio (no cae a las bocinas).

context.modules = [
  # nofail: si no carga (por ejemplo, sin libmysofa), PipeWire arranca igual, sin este bus
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "ELENA · Audífonos"
      media.name       = "ELENA · Audífonos"
      filter.graph = {
        nodes = [
          # Entradas: cada canal a sus dos caminos
          { type = builtin label = copy name = in_fl }
          { type = builtin label = copy name = in_fr }
          { type = builtin label = copy name = in_fc }
          { type = builtin label = copy name = in_lfe }
          { type = builtin label = copy name = in_rl }
          { type = builtin label = copy name = in_rr }

          # Binaural: una bocina virtual por canal (Radius en metros)
          { type = sofa label = spatializer name = sp_fl
            config = { filename = "/usr/share/libmysofa/MIT_KEMAR_normal_pinna.sofa" blocksize = 256 tailsize = 1024 }
            control = { "Azimuth" = 30.0 "Elevation" = 0.0 "Radius" = 1.5 } }
          { type = sofa label = spatializer name = sp_fr
            config = { filename = "/usr/share/libmysofa/MIT_KEMAR_normal_pinna.sofa" blocksize = 256 tailsize = 1024 }
            control = { "Azimuth" = 330.0 "Elevation" = 0.0 "Radius" = 1.5 } }
          { type = sofa label = spatializer name = sp_fc
            config = { filename = "/usr/share/libmysofa/MIT_KEMAR_normal_pinna.sofa" blocksize = 256 tailsize = 1024 }
            control = { "Azimuth" = 0.0 "Elevation" = 0.0 "Radius" = 1.5 } }
          { type = sofa label = spatializer name = sp_rl
            config = { filename = "/usr/share/libmysofa/MIT_KEMAR_normal_pinna.sofa" blocksize = 256 tailsize = 1024 }
            control = { "Azimuth" = 110.0 "Elevation" = 0.0 "Radius" = 1.5 } }
          { type = sofa label = spatializer name = sp_rr
            config = { filename = "/usr/share/libmysofa/MIT_KEMAR_normal_pinna.sofa" blocksize = 256 tailsize = 1024 }
            control = { "Azimuth" = 250.0 "Elevation" = 0.0 "Radius" = 1.5 } }
          { type = builtin label = mixer name = bin_l
            control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 "Gain 4" = 1.0 "Gain 5" = 1.0 "Gain 6" = 3.162 } }
          { type = builtin label = mixer name = bin_r
            control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 "Gain 4" = 1.0 "Gain 5" = 1.0 "Gain 6" = 3.162 } }

          # Directo: L = FL + 0.707 FC + 0.707 RL + 3.162 LFE; R igual con FR y RR
          { type = builtin label = mixer name = dir_l
            control = { "Gain 1" = 1.0 "Gain 2" = 0.707 "Gain 3" = 0.707 "Gain 4" = 3.162 } }
          { type = builtin label = mixer name = dir_r
            control = { "Gain 1" = 1.0 "Gain 2" = 0.707 "Gain 3" = 0.707 "Gain 4" = 3.162 } }

          # Salida: qué camino suena y el nivel (los mismos valores que NIVEL en src/elena/audifonos.py):
          # binaural ×0.3 (−10.5 dB) y directo ×0.5 (−6 dB); el binaural suena 4.5 dB más fuerte.
          { type = builtin label = mixer name = salida_l control = { "Gain 1" = 0.0 "Gain 2" = 0.5 } }
          { type = builtin label = mixer name = salida_r control = { "Gain 1" = 0.0 "Gain 2" = 0.5 } }

          # Graves: estante en los dos oídos (Q 0.707)
          { type = builtin label = bq_lowshelf name = graves_l control = { "Freq" = 105.0 "Q" = 0.707 "Gain" = 6.0 } }
          { type = builtin label = bq_lowshelf name = graves_r control = { "Freq" = 105.0 "Q" = 0.707 "Gain" = 6.0 } }
        ]
        links = [
          { output = "in_fl:Out"  input = "sp_fl:In" }
          { output = "in_fr:Out"  input = "sp_fr:In" }
          { output = "in_fc:Out"  input = "sp_fc:In" }
          { output = "in_rl:Out"  input = "sp_rl:In" }
          { output = "in_rr:Out"  input = "sp_rr:In" }

          { output = "sp_fl:Out L" input = "bin_l:In 1" }
          { output = "sp_fr:Out L" input = "bin_l:In 2" }
          { output = "sp_fc:Out L" input = "bin_l:In 3" }
          { output = "sp_rl:Out L" input = "bin_l:In 4" }
          { output = "sp_rr:Out L" input = "bin_l:In 5" }
          { output = "in_lfe:Out"  input = "bin_l:In 6" }
          { output = "sp_fl:Out R" input = "bin_r:In 1" }
          { output = "sp_fr:Out R" input = "bin_r:In 2" }
          { output = "sp_fc:Out R" input = "bin_r:In 3" }
          { output = "sp_rl:Out R" input = "bin_r:In 4" }
          { output = "sp_rr:Out R" input = "bin_r:In 5" }
          { output = "in_lfe:Out"  input = "bin_r:In 6" }

          { output = "in_fl:Out"  input = "dir_l:In 1" }
          { output = "in_fc:Out"  input = "dir_l:In 2" }
          { output = "in_rl:Out"  input = "dir_l:In 3" }
          { output = "in_lfe:Out" input = "dir_l:In 4" }
          { output = "in_fr:Out"  input = "dir_r:In 1" }
          { output = "in_fc:Out"  input = "dir_r:In 2" }
          { output = "in_rr:Out"  input = "dir_r:In 3" }
          { output = "in_lfe:Out" input = "dir_r:In 4" }

          { output = "bin_l:Out" input = "salida_l:In 1" }
          { output = "dir_l:Out" input = "salida_l:In 2" }
          { output = "bin_r:Out" input = "salida_r:In 1" }
          { output = "dir_r:Out" input = "salida_r:In 2" }

          { output = "salida_l:Out" input = "graves_l:In" }
          { output = "salida_r:Out" input = "graves_r:In" }
        ]
        inputs  = [ "in_fl:In" "in_fr:In" "in_fc:In" "in_lfe:In" "in_rl:In" "in_rr:In" ]
        outputs = [ "graves_l:Out" "graves_r:Out" ]
      }
      capture.props = {
        node.name      = "elena_audifonos"
        media.class    = "Audio/Sink"
        audio.channels = 6
        audio.position = [ FL FR FC LFE RL RR ]
      }
      playback.props = {
        node.name          = "elena_audifonos.salida"
        audio.channels     = 2
        audio.position     = [ FL FR ]
        node.passive       = true
        node.dont-fallback = true
        node.linger        = true
        target.object      = "@AUDIFONOS@"
      }
    }
  }
]
