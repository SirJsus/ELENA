# ELENA — mezcla para visualizadores (elena_visual)
#
# PLANTILLA: `elena equipo generar` la copia tal cual a local/pipewire/pipewire.conf.d/.
#
# Las apps que reaccionan al sonido del sistema (Waywallen, el espectro de Noctalia…) graban
# el monitor del sink por defecto, que es elena_sistema: no ven la música ni los juegos.
# elena_visual junta los buses en una sola señal y esas apps se mandan aquí con una regla
# `bus = "visual"` en local/reglas.toml (las mueve el vigilante).
#
#   elena_musica.monitor  ─[elena_visual_musica]──┐
#   elena_juegos.monitor  ─[elena_visual_juegos]──┼─► elena_visual (estéreo) ─► monitor ─► visualizadores
#   elena_sistema.monitor ─[elena_visual_sistema]─┘
#
# - Los monitores miden ANTES del volumen del bus: el visualizador se mueve igual con el bus
#   bajo o silenciado. Ganancia 1 (verificado con un tono: −20 dBFS de pico entra y sale igual).
# - 5.1 → estéreo: lo baja el stream de cada alimentador al conectarse (channelmix de PipeWire).
# - Qué buses entran: `elena visual <bus> on|off` (mise run visual). Silencia el alimentador;
#   WirePlumber recuerda el silencio entre reinicios. Sin estado guardado, entran los tres.
# - El chat no entra: va a los audífonos y no es lo que se quiere ver.
# - La captura de cada alimentador es pasiva (no despierta los buses); su salida no lo es,
#   para que la mezcla corra aunque el único que escuche sea pasivo (Noctalia lo es).

context.objects = [
  # La mezcla: sink nulo. No sale a ninguna bocina; solo se graba su monitor.
  # priority.session baja: WirePlumber nunca lo elige como sink por defecto.
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "elena_visual"
      node.description = "ELENA · Visual (interno)"
      media.class      = "Audio/Sink"
      audio.position   = [ FL FR ]
      priority.session = 1
      object.linger    = true
    }
  }
]

context.modules = [

  { name = libpipewire-module-loopback
    args = {
      node.description = "ELENA · Música → Visual"
      audio.position   = [ FL FR FC LFE RL RR ]
      capture.props = {
        node.name           = "elena_visual_musica.entrada"
        stream.capture.sink = true
        target.object       = "elena_musica"
        node.passive        = true
        node.dont-fallback  = true
        node.linger         = true
      }
      playback.props = {
        node.name          = "elena_visual_musica"
        target.object      = "elena_visual"
        node.dont-fallback = true
        node.linger        = true
      }
    }
  }

  { name = libpipewire-module-loopback
    args = {
      node.description = "ELENA · Juegos → Visual"
      audio.position   = [ FL FR FC LFE RL RR ]
      capture.props = {
        node.name           = "elena_visual_juegos.entrada"
        stream.capture.sink = true
        target.object       = "elena_juegos"
        node.passive        = true
        node.dont-fallback  = true
        node.linger         = true
      }
      playback.props = {
        node.name          = "elena_visual_juegos"
        target.object      = "elena_visual"
        node.dont-fallback = true
        node.linger        = true
      }
    }
  }

  { name = libpipewire-module-loopback
    args = {
      node.description = "ELENA · Sistema → Visual"
      audio.position   = [ FL FR ]
      capture.props = {
        node.name           = "elena_visual_sistema.entrada"
        stream.capture.sink = true
        target.object       = "elena_sistema"
        node.passive        = true
        node.dont-fallback  = true
        node.linger         = true
      }
      playback.props = {
        node.name          = "elena_visual_sistema"
        target.object      = "elena_visual"
        node.dont-fallback = true
        node.linger        = true
      }
    }
  }
]
