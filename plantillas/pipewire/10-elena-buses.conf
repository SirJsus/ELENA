# ELENA — buses tipo Voicemeeter
#
# PLANTILLA: `elena equipo generar` (lo corre `mise run aplicar`) la copia a
# local/pipewire/pipewire.conf.d/ con los valores de local/equipo.toml. No se edita la copia.
#
# Cada bus es un sink virtual (lo que eligen las apps) que reenvía a una salida
# física. El volumen de cada bus se controla por separado en pavucontrol, y
# WirePlumber lo recuerda. El sink físico 5.1 queda fijo en 100%.
#
# Salida física: el sink 5.1 de tu tarjeta (ELENA_SINK_FISICO en local/equipo.toml).
#
# Calibración: Música, Juegos y Sistema van a elena_salida (40-elena-calibracion.conf), que
# sale al físico con la ganancia, el retardo, el EQ y el cruce de cada bocina. El generador elige su
# target.object: elena_salida si existe 40-elena-calibracion.conf, si no el físico. Lo cambian
# `mise run calibracion -- activar` y `desactivar` (siempre junto con ese .conf).
#
# node.dont-fallback: si la salida no existe, el bus NO cae al sink por defecto
#   (que podría ser otro bus).
# node.linger: sin esto, WirePlumber DESTRUYE el bus cuando su salida no existe
#   (scripts/linking/find-defined-target.lua). Con linger, el bus espera a que
#   la salida aparezca (cambio de perfil, audífonos que se prenden después).

context.modules = [

  # Música (Cider, la VM de Windows con Apple Music…): 5.1 tal cual
  { name = libpipewire-module-loopback
    args = {
      node.description = "ELENA · Música"
      audio.position   = [ FL FR FC LFE RL RR ]
      capture.props = {
        node.name   = "elena_musica"
        media.class = "Audio/Sink"
      }
      playback.props = {
        node.name          = "elena_musica.salida"
        node.passive       = true
        node.dont-fallback = true
        node.linger        = true
        target.object      = "@DESTINO_BOCINAS@"
      }
    }
  }

  # Juegos (Steam, Proton y Lutris): 5.1 tal cual. Wine ve 6 canales y lo anuncia al juego.
  { name = libpipewire-module-loopback
    args = {
      node.description = "ELENA · Juegos"
      audio.position   = [ FL FR FC LFE RL RR ]
      capture.props = {
        node.name   = "elena_juegos"
        media.class = "Audio/Sink"
      }
      playback.props = {
        node.name          = "elena_juegos.salida"
        node.passive       = true
        node.dont-fallback = true
        node.linger        = true
        target.object      = "@DESTINO_BOCINAS@"
      }
    }
  }

  # Sistema (navegador y escritorio): estéreo y solo por las frontales.
  # Para repartir el estéreo en las 6 bocinas, cambia channelmix.upmix a true.
  { name = libpipewire-module-loopback
    args = {
      node.description = "ELENA · Sistema"
      audio.position   = [ FL FR ]
      capture.props = {
        node.name   = "elena_sistema"
        media.class = "Audio/Sink"
      }
      playback.props = {
        node.name          = "elena_sistema.salida"
        node.passive       = true
        node.dont-fallback = true
        node.linger        = true
        channelmix.upmix   = false
        target.object      = "@DESTINO_BOCINAS@"
      }
    }
  }

  # Chat (Discord y llamadas): a los audífonos (ELENA_AUDIFONOS en local/equipo.toml) o, sin
  # ellos, a las bocinas frontales. Si los audífonos están apagados, el bus espera (no cae a las
  # bocinas) y se conecta solo cuando aparecen. Para cambiar de destino: edita local/equipo.toml
  # y corre `mise run aplicar` (la lista de salidas sale con `mise run estado`).
  { name = libpipewire-module-loopback
    args = {
      node.description = "ELENA · Chat"
      audio.position   = [ FL FR ]
      capture.props = {
        node.name   = "elena_chat"
        media.class = "Audio/Sink"
      }
      playback.props = {
        node.name          = "elena_chat.salida"
        node.passive       = true
        node.dont-fallback = true
        node.linger        = true
        target.object      = "@CHAT@"
      }
    }
  }
]
