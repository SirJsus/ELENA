# ELENA — perfil 5.1 de tu tarjeta
#
# PLANTILLA: `elena equipo generar` la copia a local/wireplumber/wireplumber.conf.d/ con la tarjeta y el
# perfil de local/equipo.toml (ELENA_TARJETA y ELENA_PERFIL).
#
# WirePlumber elige el perfil en este orden: el guardado en su estado, luego
# estas prioridades y luego "el mejor". `mise run aplicar` fija el perfil con
# pactl (y así queda guardado); esta regla lo garantiza si el estado se borra,
# por ejemplo al reinstalar.
#
# El 5.1 analógico usa 3 jacks traseros: frontal, trasera y centro/sub.

device.profile.priority.rules = [
  {
    matches = [
      { device.name = "@TARJETA@" }
    ]
    actions = {
      update-props = {
        priorities = [
          @PRIORIDADES@
        ]
      }
    }
  }
]
